[package]
name = "tops-engine"
version = "0.1.0"
license = "MIT"
edition = "2024"
rust-version = "1.85"

[workspace]
members = ["vendor/librespot-core"]
resolver = "3"

[dependencies]
anyhow = "1"
base64 = "0.22"
librespot = { git = "https://github.com/librespot-org/librespot", rev = "939dc5ee9d833e1980f9495241219d9d4868a061", default-features = false, features = ["native-tls", "rodio-backend"] }
log = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "process", "time", "sync"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[patch."https://github.com/librespot-org/librespot"]
librespot-core = { path = "vendor/librespot-core" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
